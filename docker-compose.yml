version: "3.9"

services:
  app:
    build: .
    # network_mode: host → le container hérite du réseau de la VM Azure
    # (résolution DNS Azure fonctionne, port 8000 exposé directement)
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
